<h2 id="before-the-prompt-lives-next-to-the-code">Before: the prompt lives next to the code</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">SYSTEM_PROMPT = <span class="hljs-string">&quot;&quot;&quot;
You are an expert summarizer. Condense the content into exactly {num_sentences}
clear, neutral sentences that capture the key points.
&quot;&quot;&quot;</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">summarize</span>(<span class="hljs-params">text: <span class="hljs-built_in">str</span>, num_sentences: <span class="hljs-built_in">int</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    response = client.responses.create(
        model=<span class="hljs-string">&quot;gpt-6-luna&quot;</span>,
        reasoning={<span class="hljs-string">&quot;effort&quot;</span>: <span class="hljs-string">&quot;medium&quot;</span>},
        instructions=SYSTEM_PROMPT.<span class="hljs-built_in">format</span>(num_sentences=num_sentences),
        <span class="hljs-built_in">input</span>=text,
    )
    <span class="hljs-keyword">return</span> response.output_text
</code></pre>
<p>Also common: a <code>prompts.py</code> / <code>.yaml</code> file, prompts inside notebooks, or copy-pasted over chat.<br />

<h2 id="the-problems">The problems</h2>
<table>
<thead>
<tr>
<th>Problem</th>
<th>What it looks like in practice</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>No version history</strong></td>
<td>You &quot;improve&quot; a prompt, quality drops, and you can't recover the old wording.</td>
</tr>
<tr>
<td><strong>Deployment coupling</strong></td>
<td>A one-word tweak needs a code change, PR, build, and redeploy.</td>
</tr>
<tr>
<td><strong>No safe rollback</strong></td>
<td>Reverting means reverting a commit, not flipping a pointer.</td>
</tr>
<tr>
<td><strong>Hard to compare</strong></td>
<td>&quot;What changed between the version that worked and the one that didn't?&quot;</td>
</tr>
<tr>
<td><strong>No lineage</strong></td>
<td>Which prompt version produced this trace, evaluation, or model?</td>
</tr>
<tr>
<td><strong>Poor collaboration</strong></td>
<td>PMs and domain experts can't iterate without touching code.</td>
</tr>
<tr>
<td><strong>No quality loop</strong></td>
<td>Changes are judged by vibes, not metrics on a dataset.</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Root cause:</strong> prompts are treated as <em>incidental strings</em> instead of <em>versioned artifacts</em> with their own lifecycle.</p>
</blockquote>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="what-a-prompt-registry-offers">What a Prompt Registry offers</h2>
<ul>
<li><strong>Version control</strong> — Git-style commits; every version is <strong>immutable</strong> → reproducible</li>
<li><strong>Aliasing</strong> — mutable pointers (<code>production</code>, <code>champion</code>) to promote, A/B test, and roll back <strong>without code changes</strong></li>
<li><strong>Lineage</strong> — tied into MLflow Tracing, Evaluation, and Models</li>
<li><strong>Collaboration</strong> — one central registry with a UI for the whole team</li>
<li><strong>Quality loop</strong> — plugs straight into evaluation and automated optimization</li>
</ul>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="setup-in-mlflow-313">Setup in MLflow 3.13</h2>
<div class="cols">
<div>
<h3 id="install">Install</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">pip install --upgrade <span class="hljs-string">&quot;mlflow&gt;=3.13&quot;</span>
</code></pre>
<h3 id="start-tracking-server--ui">Start tracking server + UI</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">mlflow server --host 127.0.0.1 --port 5000
</code></pre>
<h3 id="point-your-code-at-it">Point your code at it</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> mlflow
mlflow.set_tracking_uri(<span class="hljs-string">&quot;http://127.0.0.1:5000&quot;</span>)
</code></pre>
</div>
<div>
<h3 id="core-concepts">Core concepts</h3>
<ul>
<li><strong>Prompt</strong> — named, versioned template</li>
<li><strong>Template</strong> — text or chat messages with <code>{{ variables }}</code> (Jinja2 auto-detected)</li>
<li><strong>Version</strong> — sequential &amp; immutable</li>
<li><strong>Alias</strong> — mutable pointer (<code>@production</code>)</li>
<li><strong>URI</strong> — <code>prompts:/name/1</code> or <code>prompts:/name@alias</code></li>
</ul>
<p>APIs live under <strong><code>mlflow.genai</code></strong>.</p>
</div>
</div>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">initial_template = <span class="hljs-string">&quot;&quot;&quot;\

<h2 id="load-and-use-a-prompt">Load and use a prompt</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> openai

prompt = mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/summarization-prompt/1&quot;</span>)

response = openai.OpenAI().responses.create(
    model=<span class="hljs-string">&quot;gpt-6-luna&quot;</span>,
    reasoning={<span class="hljs-string">&quot;effort&quot;</span>: <span class="hljs-string">&quot;medium&quot;</span>},
    <span class="hljs-built_in">input</span>=prompt.<span class="hljs-built_in">format</span>(num_sentences=<span class="hljs-number">2</span>, content=<span class="hljs-string">&quot;...&quot;</span>),
)
<span class="hljs-built_in">print</span>(response.output_text)
</code></pre>
<blockquote>
<p><strong>Lineage for free:</strong> calling <code>load_prompt()</code> inside a traced function or logged model records the prompt version as a dependency.</p>
</blockquote>
<p>Also useful: <code>model_config</code> (mutable model settings per version), <code>response_format</code> (structured output), and <code>mlflow.genai.search_prompts(...)</code>.</p>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">improved_template = <span class="hljs-string">&quot;&quot;&quot;\

- Use a neutral, objective tone
&quot;&quot;&quot;</span>

<h2 id="aliases-promote--roll-back-without-a-redeploy">Aliases: promote &amp; roll back without a redeploy</h2>
<div class="cols">
<div>
<h3 id="promote">Promote</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mlflow.genai.set_prompt_alias(
    <span class="hljs-string">&quot;summarization-prompt&quot;</span>,
    alias=<span class="hljs-string">&quot;production&quot;</span>, version=<span class="hljs-number">2</span>,
)
</code></pre>
<h3 id="app-always-loads-by-alias">App always loads by alias</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mlflow.genai.load_prompt(
    <span class="hljs-string">&quot;prompts:/summarization-prompt@production&quot;</span>
)
</code></pre>
<h3 id="roll-back-instantly">Roll back instantly</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mlflow.genai.set_prompt_alias(
    <span class="hljs-string">&quot;summarization-prompt&quot;</span>,
    alias=<span class="hljs-string">&quot;production&quot;</span>, version=<span class="hljs-number">1</span>,
)
</code></pre>
</div>
<div>
<h3 id="ways-to-reference-a-prompt">Ways to reference a prompt</h3>
<table>
<thead>
<tr>
<th>URI</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>prompts:/name/2</code></td>
<td>Exact version</td>
</tr>
<tr>
<td><code>prompts:/name@production</code></td>
<td>Alias target</td>
</tr>
<tr>
<td><code>prompts:/name@latest</code></td>
<td>Newest version</td>
</tr>
<tr>
<td><code>load_prompt(&quot;name&quot;)</code></td>
<td>Latest version</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Caching:</strong> version URIs cache forever; alias URIs use a 60 s TTL. Pass <code>cache_ttl_seconds=0</code> to always fetch fresh.</p>
</blockquote>
</div>

<h2 id="prompts-from-an-earlier-mlflow-eg-312">Prompts from an earlier MLflow (e.g. 3.12)</h2>
<div class="cols">
<div>
<h3 id="1-storage-is-compatible">1. Storage is compatible</h3>
<p>Same tracking backend → no migration.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mlflow.set_tracking_uri(<span class="hljs-string">&quot;http://127.0.0.1:5000&quot;</span>)

mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/summarization-prompt/1&quot;</span>)
mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/summarization-prompt@production&quot;</span>)
</code></pre>
<h3 id="2-the-api-namespace-moved">2. The API namespace moved</h3>
<p>Top-level <code>mlflow.*</code> prompt functions still work but emit a <code>FutureWarning</code>.</p>
</div>
<div>
<h3 id="migration-cheat-sheet">Migration cheat sheet</h3>
<table>
<thead>
<tr>
<th>Deprecated</th>
<th>MLflow 3.13</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>mlflow.register_prompt</code></td>
<td><code>mlflow.genai.register_prompt</code></td>
</tr>
<tr>
<td><code>mlflow.load_prompt</code></td>
<td><code>mlflow.genai.load_prompt</code></td>
</tr>
<tr>
<td><code>mlflow.search_prompts</code></td>
<td><code>mlflow.genai.search_prompts</code></td>
</tr>
<tr>
<td><code>mlflow.set_prompt_alias</code></td>
<td><code>mlflow.genai.set_prompt_alias</code></td>
</tr>
<tr>
<td><code>mlflow.delete_prompt_alias</code></td>
<td><code>mlflow.genai.delete_prompt_alias</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Mixing old and new clients? Always use the <strong>same tracking server</strong>.</p>
</blockquote>
</div>
</div>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> difflib

<h2 id="evaluate-a-prompt-on-a-dataset">Evaluate a prompt on a dataset</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> mlflow.genai.scorers <span class="hljs-keyword">import</span> Correctness

<span class="hljs-keyword">def</span> <span class="hljs-title function_">predict_fn</span>(<span class="hljs-params">content: <span class="hljs-built_in">str</span>, num_sentences: <span class="hljs-built_in">int</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    prompt = mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/summarization-prompt@production&quot;</span>)
    response = openai.OpenAI().responses.create(
        model=<span class="hljs-string">&quot;gpt-6-luna&quot;</span>,
        reasoning={<span class="hljs-string">&quot;effort&quot;</span>: <span class="hljs-string">&quot;medium&quot;</span>},
        <span class="hljs-built_in">input</span>=prompt.<span class="hljs-built_in">format</span>(content=content, num_sentences=num_sentences),
    )
    <span class="hljs-keyword">return</span> response.output_text

eval_data = [{
    <span class="hljs-string">&quot;inputs&quot;</span>: {<span class="hljs-string">&quot;content&quot;</span>: <span class="hljs-string">&quot;MLflow is an open source platform...&quot;</span>, <span class="hljs-string">&quot;num_sentences&quot;</span>: <span class="hljs-number">1</span>},
    <span class="hljs-string">&quot;expectations&quot;</span>: {<span class="hljs-string">&quot;expected_response&quot;</span>: <span class="hljs-string">&quot;MLflow is an open source ML/AI platform.&quot;</span>},
}]

results = mlflow.genai.evaluate(
    data=eval_data,
    predict_fn=predict_fn,
    scorers=[Correctness(model=<span class="hljs-string">&quot;openai:/gpt-6-luna&quot;</span>)],
)
</code></pre>

<h2 id="optimize-a-prompt-automatically">Optimize a prompt automatically</h2>
<p><code>mlflow.genai.optimize_prompts()</code> rewrites a prompt to score higher and saves it as a <strong>new version</strong>.</p>
<div class="cols">
<div>
<h3 id="it-needs-four-things">It needs four things</h3>
<ol>
<li><strong>Target prompt URI(s)</strong></li>
<li><strong><code>predict_fn</code></strong> that uses <code>load_prompt(...).format(...)</code></li>
<li><strong>Training data</strong> — <code>inputs</code> + <code>expectations</code></li>
<li><strong>An optimizer</strong> — GEPA or MetaPrompt</li>
</ol>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> mlflow.genai.optimize <span class="hljs-keyword">import</span> GepaPromptOptimizer

result = mlflow.genai.optimize_prompts(
    predict_fn=predict_fn,
    train_data=train_data,
    prompt_uris=[prompt.uri],
    optimizer=GepaPromptOptimizer(
        reflection_model=<span class="hljs-string">&quot;openai:/gpt-6-luna&quot;</span>,
        max_metric_calls=<span class="hljs-number">300</span>,
    ),
    scorers=[Correctness(model=<span class="hljs-string">&quot;openai:/gpt-6-luna&quot;</span>)],
)

optimized = result.optimized_prompts[<span class="hljs-number">0</span>]
<span class="hljs-built_in">print</span>(optimized.uri, result.initial_eval_score,
      <span class="hljs-string">&quot;-&gt;&quot;</span>, result.final_eval_score)
</code></pre>
</div>
</div>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="custom-scorers-optimize-for-more-than-correctness">Custom scorers: optimize for more than correctness</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> mlflow.genai.scorers <span class="hljs-keyword">import</span> scorer

<span class="hljs-meta">@scorer</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">accuracy_scorer</span>(<span class="hljs-params">outputs, expectations</span>):
    <span class="hljs-keyword">return</span> <span class="hljs-number">1.0</span> <span class="hljs-keyword">if</span> outputs.strip().upper() == expectations[<span class="hljs-string">&quot;expected_response&quot;</span>] <span class="hljs-keyword">else</span> <span class="hljs-number">0.0</span>

<span class="hljs-meta">@scorer</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">brevity_scorer</span>(<span class="hljs-params">outputs</span>):
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">min</span>(<span class="hljs-number">1.0</span>, <span class="hljs-number">50</span> / <span class="hljs-built_in">max</span>(<span class="hljs-built_in">len</span>(outputs), <span class="hljs-number">1</span>))

<span class="hljs-keyword">def</span> <span class="hljs-title function_">weighted_objective</span>(<span class="hljs-params">scores</span>):
    <span class="hljs-keyword">return</span> <span class="hljs-number">0.7</span> * scores[<span class="hljs-string">&quot;accuracy_scorer&quot;</span>] + <span class="hljs-number">0.3</span> * scores[<span class="hljs-string">&quot;brevity_scorer&quot;</span>]

result = mlflow.genai.optimize_prompts(
    predict_fn=predict_fn,
    train_data=train_data,
    prompt_uris=[prompt.uri],
    optimizer=GepaPromptOptimizer(reflection_model=<span class="hljs-string">&quot;openai:/gpt-6-luna&quot;</span>),
    scorers=[accuracy_scorer, brevity_scorer],
    aggregation=weighted_objective,
)
</code></pre>

<h2 id="the-prompt-lifecycle-loop">The prompt lifecycle loop</h2>
<br />
<p class="big">register → alias to production → evaluate → optimize → compare → promote the winner → roll back if needed</p>
<br />
<p>Optimized prompts land back in the registry as new versions — so the loop closes on itself.</p>
<h3 id="quick-reference">Quick reference</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mlflow.genai.register_prompt(name=<span class="hljs-string">&quot;my-prompt&quot;</span>, template=<span class="hljs-string">&quot;Hi {{ name }}&quot;</span>)
mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/my-prompt@production&quot;</span>).<span class="hljs-built_in">format</span>(name=<span class="hljs-string">&quot;Ada&quot;</span>)
mlflow.genai.set_prompt_alias(<span class="hljs-string">&quot;my-prompt&quot;</span>, alias=<span class="hljs-string">&quot;production&quot;</span>, version=<span class="hljs-number">1</span>)
mlflow.genai.search_prompts(filter_string=<span class="hljs-string">&quot;task=&#x27;summarization&#x27;&quot;</span>)
</code></pre>

<h2 id="before-every-service-talks-to-every-provider">Before: every service talks to every provider</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> os
<span class="hljs-keyword">import</span> openai
<span class="hljs-keyword">import</span> anthropic

<span class="hljs-comment"># One client, key, and SDK per provider — repeated across services</span>
openai_client = openai.OpenAI(api_key=os.environ[<span class="hljs-string">&quot;OPENAI_API_KEY&quot;</span>])
anthropic_client = anthropic.Anthropic(api_key=os.environ[<span class="hljs-string">&quot;ANTHROPIC_API_KEY&quot;</span>])

<span class="hljs-keyword">def</span> <span class="hljs-title function_">summarize</span>(<span class="hljs-params">text: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    resp = openai_client.responses.create(
        model=<span class="hljs-string">&quot;gpt-6-luna&quot;</span>,
        reasoning={<span class="hljs-string">&quot;effort&quot;</span>: <span class="hljs-string">&quot;medium&quot;</span>},
        <span class="hljs-built_in">input</span>=text,
    )
    <span class="hljs-keyword">return</span> resp.output_text
</code></pre>
<p>Each new provider = a new SDK, a new key in every service, new request/response handling.</p>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="the-problems-1">The problems</h2>
<table>
<thead>
<tr>
<th>Problem</th>
<th>What it looks like in practice</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Secrets sprawl</strong></td>
<td>Provider keys copied into every service, notebook, and CI job.</td>
</tr>
<tr>
<td><strong>Provider lock-in</strong></td>
<td>OpenAI → Anthropic means rewriting SDK calls everywhere.</td>
</tr>
<tr>
<td><strong>No central control</strong></td>
<td>Rate limits and spend caps re-implemented per app.</td>
</tr>
<tr>
<td><strong>No A/B testing or migration</strong></td>
<td>Shifting a % of traffic needs custom code.</td>
</tr>
<tr>
<td><strong>No resilience</strong></td>
<td>An outage or 429 takes the app down; fallback logic is bespoke.</td>
</tr>
<tr>
<td><strong>Fragmented observability</strong></td>
<td>Tokens, latency, and cost scattered across provider dashboards.</td>
</tr>
<tr>
<td><strong>Config = code changes</strong></td>
<td>Changing model or params redeploys every consumer.</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Root cause:</strong> each application owns its own direct, uncontrolled connection to every provider.</p>
</blockquote>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="what-an-ai-gateway-offers">What an AI Gateway offers</h2>
<ul>
<li><strong>Unified, OpenAI-compatible API</strong> — call by <em>endpoint name</em>, not provider SDK</li>
<li><strong>Centralized credentials</strong> — provider keys live only on the gateway</li>
<li><strong>Config-driven</strong> — swap models or params without redeploying apps (hot-reload)</li>
<li><strong>Rate limiting &amp; budget control</strong> — per-endpoint limits in one place</li>
<li><strong>Traffic routing &amp; fallbacks</strong> — weighted A/B splits and failover chains</li>
<li><strong>Usage tracking</strong> — one dashboard for requests, latency, errors, tokens, cost</li>
</ul>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="setting-up-the-gateway">Setting up the gateway</h2>
<div class="cols">
<div>
<h3 id="install-1">Install</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">pip install --upgrade <span class="hljs-string">&quot;mlflow[gateway]&gt;=3.13&quot;</span>
</code></pre>
<h3 id="keys-stay-on-the-gateway">Keys stay on the gateway</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">export</span> OPENAI_API_KEY=<span class="hljs-string">&quot;sk-...&quot;</span>
<span class="hljs-built_in">export</span> ANTHROPIC_API_KEY=<span class="hljs-string">&quot;sk-ant-...&quot;</span>
</code></pre>
<h3 id="start-hot-reloads-on-config-changes">Start (hot-reloads on config changes)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">mlflow gateway start --config-path config.yaml \
  --host 127.0.0.1 --port 5000
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> mlflow.deployments <span class="hljs-keyword">import</span> get_deploy_client

client = get_deploy_client(<span class="hljs-string">&quot;http://127.0.0.1:5000&quot;</span>)

)

<h2 id="option-b--openai-sdk-responses-api">Option B — OpenAI SDK, Responses API</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> openai <span class="hljs-keyword">import</span> OpenAI

client = OpenAI(
    base_url=<span class="hljs-string">&quot;http://127.0.0.1:5000/gateway/openai/v1&quot;</span>,
    api_key=<span class="hljs-string">&quot;unused&quot;</span>,  <span class="hljs-comment"># provider auth is handled by the gateway</span>
)

response = client.responses.create(
    model=<span class="hljs-string">&quot;fast-chat&quot;</span>,                 <span class="hljs-comment"># gateway endpoint name, not provider model</span>
    reasoning={<span class="hljs-string">&quot;effort&quot;</span>: <span class="hljs-string">&quot;medium&quot;</span>},    <span class="hljs-comment"># thinking effort: low / medium / high</span>
    instructions=<span class="hljs-string">&quot;You are a concise assistant.&quot;</span>,
    <span class="hljs-built_in">input</span>=<span class="hljs-string">&quot;What is MLflow AI Gateway?&quot;</span>,
)
<span class="hljs-built_in">print</span>(response.output_text)
</code></pre>
<p>The app holds <strong>no provider key</strong>.</p>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>

<h2 id="option-b--two-things-to-know">Option B — two things to know</h2>
<div class="cols">
<div>
<h3 id="which-base-url">Which base URL?</h3>
<p>The Responses API is served on the <strong>OpenAI passthrough</strong> route:</p>
<p><code>/gateway/openai/v1</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></p>
<p>The unified route only exposes <code>chat/completions</code>:</p>
<p><code>/gateway/mlflow/v1</code> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> for <code>responses.create()</code></p>
</div>
<div>
<h3 id="which-providers">Which providers?</h3>
<p>Passthrough → the endpoint must speak the Responses API: <strong>OpenAI, Azure OpenAI / Databricks, LiteLLM</strong>.</p>
<p>Anthropic-backed endpoints (<code>quality-chat</code>) → use Option A or the unified chat route.</p>
<h3 id="thinking-effort">Thinking effort</h3>
<p><code>reasoning</code> is passed through unchanged — the backing model must support reasoning.</p>
</div>
</div>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
</section>

<h2 id="combine-with-the-prompt-registry">Combine with the Prompt Registry</h2>
<p>Governed prompt in, governed model out:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> mlflow
<span class="hljs-keyword">from</span> mlflow.deployments <span class="hljs-keyword">import</span> get_deploy_client

mlflow.set_tracking_uri(<span class="hljs-string">&quot;http://127.0.0.1:5000&quot;</span>)
gateway = get_deploy_client(<span class="hljs-string">&quot;http://127.0.0.1:5000&quot;</span>)

prompt = mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/summarization-prompt@production&quot;</span>)
messages = [{<span class="hljs-string">&quot;role&quot;</span>: <span class="hljs-string">&quot;user&quot;</span>,
             <span class="hljs-string">&quot;content&quot;</span>: prompt.<span class="hljs-built_in">format</span>(num_sentences=<span class="hljs-number">2</span>, content=<span class="hljs-string">&quot;...&quot;</span>)}]

response = gateway.predict(endpoint=<span class="hljs-string">&quot;fast-chat&quot;</span>, inputs={<span class="hljs-string">&quot;messages&quot;</span>: messages})
<span class="hljs-built_in">print</span>(response[<span class="hljs-string">&quot;choices&quot;</span>][<span class="hljs-number">0</span>][<span class="hljs-string">&quot;message&quot;</span>][<span class="hljs-string">&quot;content&quot;</span>])
</code></pre>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>

<h2 id="pydantic-ai-through-the-gateway">Pydantic AI through the gateway</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> pydantic_ai <span class="hljs-keyword">import</span> Agent
<span class="hljs-keyword">from</span> pydantic_ai.models.openai <span class="hljs-keyword">import</span> OpenAIResponsesModel, OpenAIResponsesModelSettings
<span class="hljs-keyword">from</span> pydantic_ai.providers.openai <span class="hljs-keyword">import</span> OpenAIProvider

model = OpenAIResponsesModel(
    <span class="hljs-string">&quot;fast-chat&quot;</span>,  <span class="hljs-comment"># MLflow gateway endpoint name</span>
    provider=OpenAIProvider(
        base_url=<span class="hljs-string">&quot;http://127.0.0.1:5000/gateway/openai/v1&quot;</span>,
        api_key=<span class="hljs-string">&quot;unused&quot;</span>,  <span class="hljs-comment"># gateway holds the real provider key</span>
    ),
    settings=OpenAIResponsesModelSettings(openai_reasoning_effort=<span class="hljs-string">&quot;medium&quot;</span>),
)

agent = Agent(model, system_prompt=<span class="hljs-string">&quot;You are a concise assistant.&quot;</span>)
<span class="hljs-built_in">print</span>(agent.run_sync(<span class="hljs-string">&quot;Explain the MLflow AI Gateway in one sentence.&quot;</span>).output)

<span class="hljs-comment"># Feed the agent a governed system prompt from the registry</span>
sys_prompt = mlflow.genai.load_prompt(<span class="hljs-string">&quot;prompts:/support-assistant@production&quot;</span>)
agent = Agent(model, system_prompt=sys_prompt.<span class="hljs-built_in">format</span>(tone=<span class="hljs-string">&quot;friendly&quot;</span>))
</code></pre>
<p>Anthropic-backed endpoint? Use <code>OpenAIChatModel</code> with <code>.../gateway/mlflow/v1</code>. Add <code>mlflow.openai.autolog()</code> for traces.</p>

<h2 id="traffic-routing--fallbacks">Traffic routing &amp; fallbacks</h2>
<div class="cols">
<div>
<p><span class="pill">Priority 1</span></p>
<h3 id="traffic-split">Traffic split</h3>
<p>Several models on one endpoint, each with a weight.</p>
<ul>
<li>Weights 1–100%, <strong>must sum to exactly 100%</strong></li>
<li>e.g. 50% GPT-5 / 50% Claude 4.5 Sonnet to test Claude on real traffic</li>
</ul>
<p><strong>Use for:</strong> A/B tests, gradual migration, load distribution</p>
</div>
<div>
<p><span class="pill">Priority 2</span></p>
<h3 id="fallbacks">Fallbacks</h3>
<p>Ordered models tried <strong>top to bottom</strong> when the primary errors or is rate-limited.</p>
<ul>
<li>e.g. primary → GPT-5 mini → Claude 4.5 Haiku → error</li>
<li>First success wins</li>
</ul>
<p><strong>Use for:</strong> outages, throttling, regional failover</p>
</div>
</div>
<blockquote>
<p><strong>Pitfall:</strong> fallbacks only activate once traffic-split weights total exactly 100%. Callers still use one endpoint name — app code never changes.</p>
</blockquote>

<h2 id="usage-tracking">Usage tracking</h2>
<div class="cols">
<div>
<h3 id="enable">Enable</h3>
<p>Endpoint detail page → <strong>Usage Tracking</strong> → toggle <strong>on</strong> → <strong>Save changes</strong></p>
<h3 id="view">View</h3>
<p><strong>AI Gateway › Usage</strong> (or the endpoint's <strong>Usage</strong> tab). Filter by endpoint, hour/day/week, and time range.</p>
<blockquote>
<p>Token and cost charts depend on provider support and pricing data — some may be empty.</p>
</blockquote>
</div>
<div>
<h3 id="dashboard">Dashboard</h3>
<ul>
<li><strong>Requests</strong> — volume over time</li>
<li><strong>Latency</strong> — p50 / p90 / p99</li>
<li><strong>Errors</strong> — rate &amp; breakdown</li>
<li><strong>Token usage</strong> — input vs. output</li>
<li><strong>Tokens per request</strong></li>
<li><strong>Cost</strong> — by model or provider, over time</li>
</ul>
</div>
</div>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>

<div class="cols">
<div>
<h3 id="prompt-registry--what-you-say">Prompt Registry — <em>what you say</em></h3>
<ul>
<li>Prompts as immutable, versioned artifacts</li>
<li>Aliases decouple prompts from deploys</li>
<li>Diff → evaluate → optimize → promote</li>
<li><code>mlflow.genai.*</code> APIs</li>
</ul>
</div>
<div>
<h3 id="ai-gateway--how-you-reach-the-model">AI Gateway — <em>how you reach the model</em></h3>
<ul>
<li>One endpoint name, any provider</li>
<li>Keys, limits, budgets in one place</li>
<li>Routing &amp; fallbacks behind the endpoint</li>
<li>Unified usage &amp; cost tracking</li>
</ul>
</div>
</div>
<footer>MLflow 3.13 · Prompt Registry &amp; AI Gateway</footer>
